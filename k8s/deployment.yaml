apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-devops
  namespace: hello-devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-devops
  template:
    metadata:
      labels:
        app: hello-devops
    spec:
      containers:
        - name: hello-devops
          image: localhost:30600/hello-devops:15
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "15"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
